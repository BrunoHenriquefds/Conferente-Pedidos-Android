name: Gerar APK Android Nativo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto
        run: |
          java -version
          gradle --version
          ls -la
          ls -la app

      - name: Compilar APK Android
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conferente-Pedidos-Android-Nativo
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
