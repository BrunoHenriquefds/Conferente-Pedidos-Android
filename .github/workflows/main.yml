name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
          cmake libffi-dev libssl-dev

      - name: Verificar ambiente
        run: |
          python --version
          git --version
          java -version
          which python
          which git
          which java

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Limpar compilacao anterior
        run: |
          rm -rf .buildozer

      - name: Gerar APK
        run: |
          python --version
          git --version

          echo "Primeira preparacao..."
          buildozer android debug || true

          echo "Aplicando correcao..."

          python - <<'PY'
          from pathlib import Path

          p = Path(".buildozer/android/platform/python-for-android/pythonforandroid/build.py")

          if not p.exists():
              raise SystemExit("Arquivo build.py nao encontrado")

          text = p.read_text()

          old = "shprint(host_python, '-m', 'venv', 'venv')"
          new = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

          if old in text:
              text = text.replace(old, new)
              p.write_text(text)
              print("Correcao aplicada.")
          elif new in text:
              print("Correcao ja estava aplicada.")
          else:
              raise SystemExit("Linha esperada nao encontrada")
          PY

          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv

          echo "Gerando APK..."
          buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conferente-Pedidos-Android
          path: bin/*.apk
          if-no-files-found: error
